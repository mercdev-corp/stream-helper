name: Auto Create PR

on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'
      - 'ci/**'
      - 'build/**'
      - 'perf/**'
      - 'bugfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Auto Create Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Determine reviewer (repo owner / admin user)
          REPO_OWNER="${{ github.repository_owner }}"
          REVIEWER=""
          OWNER_TYPE=$(gh api "repos/${{ github.repository }}" --jq '.owner.type' 2>/dev/null || echo "")
          if [ "$OWNER_TYPE" = "User" ]; then
            REVIEWER="$REPO_OWNER"
          else
            ADMIN_USER=$(gh api "repos/${{ github.repository }}/collaborators" --jq '[.[] | select(.permissions.admin == true) | .login] | first' 2>/dev/null || echo "")
            if [ -n "$ADMIN_USER" ]; then
              REVIEWER="$ADMIN_USER"
            elif [ "${{ github.actor }}" != "github-actions[bot]" ] && [ "${{ github.actor }}" != "github-actions" ]; then
              REVIEWER="${{ github.actor }}"
            else
              REVIEWER="qnub"
            fi
          fi

          echo "Checking if an open PR exists for branch '$BRANCH_NAME' targeting 'main'..."
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            # Use commit subject or branch name as title
            COMMIT_MSG=$(git log -1 --pretty=%s)
            TITLE="${COMMIT_MSG:-$BRANCH_NAME}"

            echo "Creating new PR: '$TITLE' ($BRANCH_NAME -> main)..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$TITLE" \
              --body "Automated Pull Request created on push to branch \`$BRANCH_NAME\`." || true

            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          else
            echo "An open PR #$EXISTING_PR already exists for $BRANCH_NAME."
          fi

          if [ -n "$EXISTING_PR" ]; then
            echo "Open PR #$EXISTING_PR is confirmed."
            if [ -n "$REVIEWER" ]; then
              ASSIGNED_OR_APPROVED=$(gh pr view "$EXISTING_PR" --json reviews,reviewRequests --jq '[.reviewRequests[].login, (.reviews[] | select(.state == "APPROVED") | .author.login)][]' 2>/dev/null | grep -xF "$REVIEWER" || true)
              if [ -z "$ASSIGNED_OR_APPROVED" ]; then
                echo "Requesting review from '$REVIEWER' for PR #$EXISTING_PR..."
                gh pr edit "$EXISTING_PR" --add-reviewer "$REVIEWER" 2>/dev/null || true
              else
                echo "Reviewer '$REVIEWER' is already assigned or has approved PR #$EXISTING_PR."
              fi
            fi
            exit 0
          else
            echo "Error: Failed to find or create open PR for branch $BRANCH_NAME targeting main."
            exit 1
          fi
