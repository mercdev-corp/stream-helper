name: CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'
      - 'ci/**'
      - 'build/**'
      - 'perf/**'
      - 'bugfix/**'

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution dependencies
        run: dotnet restore StreamHelper.sln -m:1

      - name: Build solution
        run: dotnet build StreamHelper.sln -c Release --no-restore -m:1

      - name: Run unit tests
        run: dotnet run --project tests/StreamHelper.Tests/StreamHelper.Tests.csproj -c Release --no-build -- --settings .runsettings
