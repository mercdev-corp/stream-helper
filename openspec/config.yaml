schema: spec-driven

# Project context
context: |
  Tech stack: .NET 10 Windows Forms (StreamHelper.Server, StreamHelper.Client, StreamHelper.Shared)
  Architecture & Core Requirements:
  - Immediate Persistence & Live Application: All settings in settings forms/dialogs (trackbars, checkboxes, dropdowns, numeric up/downs, text inputs) must be saved to settings and applied immediately to the active running services, monitors, and engines upon user interaction (no separate "Apply" or "Save" button).

